<svg viewBox="0 0 600 350" width="100%" height="100%" style="background-color: #030014;">
  <!-- Left half graphical elements -->
  <rect x="20" y="20" width="300" height="200" fill="none" stroke="#a855f7" stroke-width="2" rx="5"/>
  <text x="25" y="40" font-size="14" fill="#ffffff" font-family="system-ui, sans-serif">C</text>
  <line x1="50" y1="50" x2="250" y2="50" stroke="#06b6d4" stroke-width="2"/>
  <line x1="50" y1="150" x2="250" y2="150" stroke="#06b6d4" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="150" stroke="#06b6d4" stroke-width="2"/>
  <line x1="250" y1="50" x2="250" y2="150" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="100" cy="100" r="20" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
  <circle cx="200" cy="100" r="20" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <line x1="100" y1="120" x2="200" y2="120" stroke="#a855f7" stroke-width="2"/>
  <text x="150" y="140" font-size="14" fill="#ffffff" font-family="system-ui, sans-serif">d</text>
  <!-- Right half legend and keys -->
  <foreignObject x="350" y="30" width="220" height="290">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; line-height: 1.5; word-wrap: break-word; word-break: break-word;">
      <h3 style="color: #ffffff; font-size: 13px; font-weight: bold; margin: 0 0 8px 0;">Key Details:</h3>
      <ul style="margin: 0; padding-left: 14px; color: #cbd5e1;">
        <li style="margin-bottom: 6px;"><strong style="color: #34d399;">Capacitance (C):</strong> The ability of a body to store electric charge.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #f59e0b;">Dielectric:</strong> A non-conductive material that can be polarized by an electric field.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #06b6d4;">Plate Separation (d):</strong> The distance between the two conductive plates of a capacitor.</li>
      </ul>
    </div>
  </foreignObject>
</svg>