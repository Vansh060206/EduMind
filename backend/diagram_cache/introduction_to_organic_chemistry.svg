<svg viewBox="0 0 600 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="350" fill="#030014" rx="0" />
  <circle cx="50" cy="100" r="20" fill="#a855f7" />
  <circle cx="50" cy="150" r="20" fill="#06b6d4" />
  <circle cx="50" cy="200" r="20" fill="#34d399" />
  <circle cx="50" cy="250" r="20" fill="#f59e0b" />
  <line x1="100" y1="100" x2="200" y2="100" stroke="#a855f7" stroke-width="2" />
  <line x1="100" y1="150" x2="200" y2="150" stroke="#06b6d4" stroke-width="2" />
  <line x1="100" y1="200" x2="200" y2="200" stroke="#34d399" stroke-width="2" />
  <line x1="100" y1="250" x2="200" y2="250" stroke="#f59e0b" stroke-width="2" />
  <text x="120" y="110" font-size="14" fill="#ffffff">Alkane</text>
  <text x="120" y="160" font-size="14" fill="#ffffff">Alkene</text>
  <text x="120" y="210" font-size="14" fill="#ffffff">Alkyne</text>
  <text x="120" y="260" font-size="14" fill="#ffffff">Aromatic</text>
  <path d="M 150 50 L 250 50 L 200 150 Z" fill="#a855f7" opacity="0.5" />
  <path d="M 150 120 L 250 120 L 200 220 Z" fill="#06b6d4" opacity="0.5" />
  <path d="M 200 50 L 300 50 L 250 150 Z" fill="#34d399" opacity="0.5" />
  <path d="M 200 120 L 300 120 L 250 220 Z" fill="#f59e0b" opacity="0.5" />
  <foreignObject x="350" y="30" width="220" height="290">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; line-height: 1.5; word-wrap: break-word; word-break: break-word;">
      <h3 style="color: #ffffff; font-size: 13px; font-weight: bold; margin: 0 0 8px 0;">Key Details:</h3>
      <ul style="margin: 0; padding-left: 14px; color: #cbd5e1;">
        <li style="margin-bottom: 6px;"><strong style="color: #34d399;">Alkane:</strong> Saturated hydrocarbon with single bonds.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #06b6d4;">Alkene:</strong> Unsaturated hydrocarbon with double bonds.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #a855f7;">Alkyne:</strong> Unsaturated hydrocarbon with triple bonds.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #f59e0b;">Aromatic:</strong> Hydrocarbon with planar, ring-shaped molecule.</li>
      </ul>
    </div>
  </foreignObject>
</svg>