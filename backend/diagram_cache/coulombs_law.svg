<svg viewBox="0 0 600 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="350" fill="#030014" rx="0" />
  <line x1="50" y1="50" x2="50" y2="300" stroke="#a855f7" stroke-width="2" />
  <line x1="50" y1="175" x2="280" y2="175" stroke="#a855f7" stroke-width="2" />
  <text x="40" y="60" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif">y</text>
  <text x="60" y="185" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif">x</text>
  <circle cx="150" cy="175" r="20" fill="#06b6d4" />
  <circle cx="250" cy="175" r="20" fill="#34d399" />
  <line x1="150" y1="175" x2="250" y2="175" stroke="#f59e0b" stroke-width="2" />
  <line x1="150" y1="155" x2="150" y2="195" stroke="#f59e0b" stroke-width="2" />
  <line x1="250" y1="155" x2="250" y2="195" stroke="#f59e0b" stroke-width="2" />
  <text x="120" y="160" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif">q1</text>
  <text x="220" y="160" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif">q2</text>
  <text x="200" y="190" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif">r</text>
  <foreignObject x="350" y="30" width="220" height="290">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; line-height: 1.5; word-wrap: break-word; word-break: break-word;">
      <h3 style="color: #ffffff; font-size: 13px; font-weight: bold; margin: 0 0 8px 0;">Key Details:</h3>
      <ul style="margin: 0; padding-left: 14px; color: #cbd5e1;">
        <li style="margin-bottom: 6px;"><strong style="color: #34d399;">Coulomb's Law:</strong> States that the magnitude of the electrostatic force between two point charges is directly proportional to the product of the magnitudes of charges and inversely proportional to the square of the distance between them.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #a855f7;">Electric Field:</strong> A vector field that surrounds charged particles and exerts force on other charged particles.</li>
        <li style="margin-bottom: 6px;"><strong style="color: #06b6d4;">Point Charges:</strong> Charges that are considered to be concentrated at a single point in space.</li>
      </ul>
    </div>
  </foreignObject>
</svg>